name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom icon
        run: |
          ICON=$(ls icon.png icon.jpg icon.jpeg icon.webp 2>/dev/null | head -1)
          if [ -z "$ICON" ]; then
            echo "No custom icon found, keeping default"
            exit 0
          fi
          IM=$(command -v magick || command -v convert || true)
          if [ -z "$IM" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            IM=$(command -v magick || command -v convert)
          fi
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${spec%%:*}
            size=${spec##*:}
            mkdir -p $RES/mipmap-$dir
            $IM "$ICON" -resize ${size}x${size}^ -gravity center -extent ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Analyzer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
